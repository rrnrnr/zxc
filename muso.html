<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>muso game</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            width:100%;
            height:100vh;
            overflow:hidden;
            background:#111;
            color:white;
        }

        .start-screen{
            position:absolute;
            width:100%;
            height:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:#111;
            z-index:10;
        }

        .start-screen h1{
            font-size:50px;
            margin-bottom:20px;
        }

        .start-btn{
            padding:15px 40px;
            font-size:22px;
            border:none;
            border-radius:10px;
            background:#00ff88;
            color:black;
            cursor:pointer;
            transition:0.3s;
        }

        .start-btn:hover{
            transform:scale(1.05);
        }

        .game-area{
            position:relative;
            width:100%;
            height:100vh;
            display:none;
            overflow:hidden;
        }

        .score{
            position:absolute;
            top:20px;
            left:20px;
            font-size:30px;
            z-index:5;
            background:rgba(0,0,0,0.5);
            padding:10px 20px;
            border-radius:10px;
        }

        .target{
            position:absolute;
            width:120px;
            height:120px;
            object-fit:cover;
            cursor:pointer;
            user-select:none;
            transition:0.1s;
        }

        .target:active{
            transform:scale(0.9);
        }

        .game-over{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.8);
            display:none;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            z-index:20;
        }

        .game-over h1{
            font-size:60px;
            margin-bottom:20px;
        }

        .restart-btn{
            padding:15px 35px;
            font-size:24px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:#00ff88;
        }

        @media(max-width:600px){

            .target{
                width:90px;
                height:90px;
            }

            .score{
                font-size:24px;
            }

            .start-screen h1{
                font-size:35px;
            }

        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div class="start-screen" id="startScreen">
        <h1>muso game</h1>
        <button class="start-btn" onclick="startGame()">PLAY MUSO GAME</button>
    </div>

    <!-- GAME AREA -->
    <div class="game-area" id="gameArea">

        <div class="score">
            Score: <span id="score">0</span>
        </div>

        <img
            src="photo_2026-05-24_19-04-59.jpg"
            id="target"
            class="target"
        />

    </div>

    <!-- GAME OVER -->
    <div class="game-over" id="gameOver">
        <h1>Game Over</h1>
        <button class="restart-btn" onclick="restartGame()">
            Restart
        </button>
    </div>

    <!-- SOUND -->
    <audio id="clickSound">
        <source src="drim gayporno.mp3" type="audio/mp3">
    </audio>

    <script>

        const startScreen = document.getElementById("startScreen");
        const gameArea = document.getElementById("gameArea");
        const target = document.getElementById("target");
        const scoreText = document.getElementById("score");
        const clickSound = document.getElementById("clickSound");
        const gameOver = document.getElementById("gameOver");

        let score = 0;
        let gameTime = 30;
        let timer;

        function startGame(){

            startScreen.style.display = "none";
            gameArea.style.display = "block";

            moveTarget();

            timer = setTimeout(() => {
                endGame();
            }, gameTime * 1000);

        }

        function moveTarget(){

            const maxX = window.innerWidth - 120;
            const maxY = window.innerHeight - 120;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";

        }

        target.addEventListener("click", () => {

            score++;
            scoreText.innerText = score;

            clickSound.currentTime = 0;
            clickSound.play();

            moveTarget();

        });

        function endGame(){

            gameOver.style.display = "flex";

        }

        function restartGame(){

            location.reload();

        }

    </script>

</body>
</html>
